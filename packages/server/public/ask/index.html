<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ask the Agent</title>
    <script type="module" crossorigin src="/ask/assets/index-DbkD9gxD.js"></script>
    <link rel="stylesheet" crossorigin href="/ask/assets/index-cvvbWx-k.css">
  </head>
  <body>
    <main id="stage">
      <iframe
        id="avatar"
        src="https://three.ws/agent-embed.html"
        title="3D agent avatar"
        loading="eager"
        allow="autoplay; clipboard-write"
        referrerpolicy="no-referrer-when-downgrade"
      ></iframe>

      <section id="chat">
        <header>
          <h1>Ask the Agent</h1>
          <button id="connect" type="button">Connect wallet</button>
          <span id="wallet-status" hidden></span>
        </header>

        <ol id="transcript" aria-live="polite"></ol>

        <form id="ask-form">
          <input
            id="question"
            name="question"
            type="text"
            placeholder="Ask anything — $0.01 USDC per question"
            autocomplete="off"
            maxlength="500"
            required
          />
          <button id="send" type="submit">Ask ($0.01)</button>
        </form>

        <p id="hint">
          You'll be asked to sign a small USDC payment in Phantom (Solana) or
          MetaMask (Base). The agent answers in voice + text.
        </p>
      </section>
    </main>
  </body>
</html>
